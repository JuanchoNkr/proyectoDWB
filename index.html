<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Gestor de Tareas</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<h1>Gestor de Tareas</h1>

<div class="task-input">
<input type="text" id="taskInput" placeholder="Escribe una nueva tarea">
<button onclick="addTask()">Agregar</button>
</div>

<div class="filters">
<button onclick="filterTasks('all')">Todas</button>
<button onclick="filterTasks('completed')">Completadas</button>
<button onclick="filterTasks('pending')">Pendientes</button>
</div>

<ul id="taskList"></ul>

</div>

<script src="script.js"></script>

</body>
</html>
